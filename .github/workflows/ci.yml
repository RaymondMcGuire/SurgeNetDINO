name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Use committed lock, or resolve first bootstrap lock
        shell: bash
        run: |
          if test -f uv.lock; then
            uv lock --check
          else
            echo "::warning::No committed uv.lock. Bootstrap only; download and commit the generated lock."
            uv lock
          fi
      - run: uv sync --locked --extra cpu --group dev
      - run: uv run --locked --extra cpu python -m surgenet_dino doctor
      - run: uv run --locked --extra cpu ruff check surgenet_dino scripts tests examples load_models.py
      - run: uv run --locked --extra cpu python -m pytest -q --junitxml=outputs/ci-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            uv.lock
            outputs/ci-results.xml
