[project]
name = "surgenet-dino"
version = "0.3.0"
description = "uv-managed SurgeNetDINO model loading and experiment foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "timm==1.0.24",
    "pillow>=11,<13",
    "huggingface-hub>=0.34,<2",
]

# Select one backend on EVERY uv sync/run invocation. The launch scripts do this.
[project.optional-dependencies]
cu128 = ["torch==2.10.0", "torchvision==0.25.0"]
cpu = ["torch==2.10.0", "torchvision==0.25.0"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false
required-version = ">=0.10.0"
# The intended target is an RTX workstation: Windows/Linux x86-64.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: real timm DINO architecture tests, CPU, no weight downloads",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
